<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc"><title id="title">The lifecycle of one job</title><desc id="desc">Proposed persisted job states. A safe retry returns a failed job to queued; real implementations need idempotency.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#075985"/></marker></defs><style>text{font-family:system-ui,sans-serif}</style><rect width="1080" height="570" fill="#ffffff"/>
<text x="28" y="42" fill="#173042" font-size="26" text-anchor="start">The lifecycle of one job</text>
<text x="28" y="70" fill="#173042" font-size="13" text-anchor="start">STATE</text>
<path d="M290 195L770 195" fill="none" stroke="#075985" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="472.2" y="166" width="115.60000000000001" height="21" fill="#ffffff"/><text x="530" y="182" fill="#173042" font-size="16" text-anchor="middle">Worker claim</text>
<path d="M880 230L880 420" fill="none" stroke="#075985" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="897.2" y="309" width="115.60000000000001" height="21" fill="#ffffff"/><text x="955" y="325" fill="#173042" font-size="16" text-anchor="middle">Result saved</text>
<path d="M770 195L290 455" fill="none" stroke="#075985" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="454.6" y="296" width="150.8" height="21" fill="#ffffff"/><text x="530" y="312" fill="#173042" font-size="16" text-anchor="middle">Processing error</text>
<path d="M180 420L180 230" fill="none" stroke="#075985" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="206" y="309" width="98" height="21" fill="#ffffff"/><text x="255" y="325" fill="#173042" font-size="16" text-anchor="middle">Safe retry</text>
<rect x="70" y="160" width="220" height="70" rx="6" fill="#f1f7fb" stroke="#b5c9d6"/>
<text x="180" y="197" fill="#173042" font-size="16" text-anchor="middle">QUEUED</text>
<rect x="770" y="160" width="220" height="70" rx="6" fill="#f1f7fb" stroke="#b5c9d6"/>
<text x="880" y="197" fill="#173042" font-size="16" text-anchor="middle">RUNNING</text>
<rect x="770" y="420" width="220" height="70" rx="6" fill="#f1f7fb" stroke="#b5c9d6"/>
<text x="880" y="457" fill="#173042" font-size="16" text-anchor="middle">COMPLETED</text>
<rect x="70" y="420" width="220" height="70" rx="6" fill="#f1f7fb" stroke="#b5c9d6"/>
<text x="180" y="457" fill="#173042" font-size="16" text-anchor="middle">FAILED</text>
</svg>