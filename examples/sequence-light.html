<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acknowledgement is not completion</title><style>:root{color-scheme:light}html,body{background:#ffffff;color:#173042}body{margin:0;padding:28px;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto}.diagram{overflow:auto}svg{display:block;width:100%;height:auto;min-width:700px;background:#ffffff}p{max-width:90ch;color:#526878}a{color:#075985}</style></head><body><main><div class="diagram"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="title desc"><title id="title">Acknowledgement is not completion</title><desc id="desc">Proposed interaction. The response returns before the worker stores a result; the client later reads status.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#075985"/></marker></defs><style>text{font-family:system-ui,sans-serif}</style><rect width="1000" height="1030" fill="#ffffff"/>
